version: '3.9'

services:
  db:
    image: postgres:15
    env_file:
      - ./backend-proyecto-integrador/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: carmen_goudie
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-proyecto-integrador
      dockerfile: Dockerfile
    container_name: dev-backend
    env_file:
      - ./backend-proyecto-integrador/.env
    environment:
      # Sobreescribe DATABASE_URL para usar el hostname de Docker (db) en lugar de localhost
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/carmen_goudie
      CORS_ORIGINS: "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://localhost:3000,http://localhost:3001"
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend-proyecto-integrador:/app
      - /app/node_modules
    # El seed se ejecuta manualmente una sola vez: docker compose exec backend npm run seed
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run seed && npm run start:dev"

volumes:
  db_data:
